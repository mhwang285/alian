# Event cuts
selections:
  event:
    event_sel: selMC
    rct: CBT
  track:
    pt_min: 0.150
    track_sel: globalTrack

jet_finder:
  R: 0.4
  alg: antikt
  pT_min: 10

analysis:
  pt_min_eec: 1.0
  pThat_scale_det: 4
  pThat_scale_gen: 6

output:
  bins:
    jet_pT: ['lin', 10, 150, 14]
    RL: ['log', 1.0e-2, 0.4, 20]
    ew: ['log', 3.0e-5, 1, 15]
  histograms:
    jet_pT_det: [1, "jet_pT_det", "Det. jet #it{p}_{T} spectrum;jet #it{p}_{T} (GeV);Counts", jet_pT]
    jet_pT_gen: [1, "jet_pT_gen", "Gen. jet #it{p}_{T} spectrum;jet #it{p}_{T} (GeV);Counts", jet_pT]
    eec_T_det:  [3d, "eec_T_det",  "3D EEC (T, det);#it{R}_{L};energy weight;jet #it{p}_{T} (GeV)",  RL, ew, jet_pT]
    eec_T_gen:  [3d, "eec_T_gen",  "3D EEC (T, gen);#it{R}_{L};energy weight;jet #it{p}_{T} (GeV)",  RL, ew, jet_pT]
    eec_P_det:  [3d, "eec_P_det",  "3D EEC (P, det);#it{R}_{L};energy weight;jet #it{p}_{T} (GeV)",  RL, ew, jet_pT]
    eec_P_gen:  [3d, "eec_P_gen",  "3D EEC (P, gen);#it{R}_{L};energy weight;jet #it{p}_{T} (GeV)",  RL, ew, jet_pT]
    eec_M_det:  [3d, "eec_M_det",  "3D EEC (M, det);#it{R}_{L};energy weight;jet #it{p}_{T} (GeV)",  RL, ew, jet_pT]
    eec_M_gen:  [3d, "eec_M_gen",  "3D EEC (M, gen);#it{R}_{L};energy weight;jet #it{p}_{T} (GeV)",  RL, ew, jet_pT]
    eec_PM_det: [3d, "eec_PM_det", "3D EEC (PM, det);#it{R}_{L};energy weight;jet #it{p}_{T} (GeV)", RL, ew, jet_pT]
    eec_PM_gen: [3d, "eec_PM_gen", "3D EEC (PM, gen);#it{R}_{L};energy weight;jet #it{p}_{T} (GeV)", RL, ew, jet_pT]