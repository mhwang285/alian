# Event cuts
selections:
  event:
    event_sel: selMC
    rct: CBT
  track:
    pt_min: 0.150
    track_sel: globalTrack

jet_finder:
  R: 0.4
  alg: antikt
  pT_min: 10

analysis:
  pt_min_eec: 1.0

output:
  bins:
    jet_pT: ['lin', 10, 150, 14]
    RL: ['log', 1.0e-2, 0.4, 20]
    ew: ['log', 3.0e-5, 1, 15]
  histograms:
    jet_pT: [1, "jet_pT", "Jet #it{p}_{T} spectrum;jet #it{p}_{T} (GeV);Counts", jet_pT]
    eec_T:  [3d, "eec_T",  "3D EEC_T;#it{R}_{L};energy weight;jet #it{p}_{T} (GeV)",  RL, ew, jet_pT]
    eec_P:  [3d, "eec_P",  "3D EEC_P;#it{R}_{L};energy weight;jet #it{p}_{T} (GeV)",  RL, ew, jet_pT]
    eec_M:  [3d, "eec_M",  "3D EEC_M;#it{R}_{L};energy weight;jet #it{p}_{T} (GeV)",  RL, ew, jet_pT]
    eec_PM: [3d, "eec_PM", "3D EEC_PM;#it{R}_{L};energy weight;jet #it{p}_{T} (GeV)", RL, ew, jet_pT]