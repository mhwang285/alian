# Event cuts
selections:
  event:
    event_sel: selMC
    rct: CBT
  track:
    pt_min: 0.150
    track_sel: globalTrack

# remove the jet_finder section below if jets are not needed in analysis
jet_finder:
  R: 0.4
  alg: antikt
  pT_min: 5

analysis:
  pt_min_eec: 1.0
  pThat_scale_det: 4
  pThat_scale_gen: 6

output:
  bins:
    # jet_pT: ['lin', 10, 150, 14]
    jet_pT: ['c', [5, 20, 30, 40, 50, 60, 70, 80, 90, 100, 110, 120, 130, 140, 150]]
    RL: ['log', 1.0e-2, 0.4, 20]
    ew: ['log', 3.0e-5, 1, 15]
  responses:
    eec_T_unf: [3d, "eec_T_unf", "EEC T response matrix", RL, ew, jet_pT, RL, ew, jet_pT]
    eec_P_unf: [3d, "eec_P_unf", "EEC P response matrix", RL, ew, jet_pT, RL, ew, jet_pT]
    eec_M_unf: [3d, "eec_M_unf", "EEC P response matrix", RL, ew, jet_pT, RL, ew, jet_pT]
    eec_PM_unf: [3d, "eec_PM_unf", "EEC P response matrix", RL, ew, jet_pT, RL, ew, jet_pT]