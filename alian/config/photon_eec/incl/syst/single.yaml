# to be used with alian/analysis/example/example_analysis_mc.py
constants: # a YAML hack to define constants
  pi34: &pi34 2.35619449019
  halfpi: &pihalf 1.57079632679
  pi: &pi 3.14159265359

# Event cuts
selections:
  event:
    event_sel: selMC
    rct: CBT
  track:
    pt_min: 0.150
    track_sel: globalTrack

# remove the jet_finder section below if jets are not needed in analysis
jet_finder:
  R: 0.4
  alg: antikt
  pT_min: 10

analysis:
  pt_min_eec: 1.0
  rng_seed: null
  pThat_scale_det: 4
  pThat_scale_gen: 6

output:
  bins:
    track_pT: ['log', 0.1, 20, 300]
    jet_pT: ['lin', 0, 200, 200]
    RL: ['log', 1.0e-2, 0.4, 20]
  histograms:
    track_pT_rej: [1, "track_pT_rej", "Rejected det. track #it{p}_{T} spectrum;#it{p}_{T} (GeV);dN/d#it{p}_{T}", track_pT]
    track_pT_det: [1, "track_pT_det", "Det. track #it{p}_{T} spectrum;#it{p}_{T} (GeV);dN/d#it{p}_{T}", track_pT]
    track_pT_gen: [1, "track_pT_gen", "Gen. track #it{p}_{T} spectrum;#it{p}_{T} (GeV);dN/d#it{p}_{T}", track_pT]
    jet_pT_rej: [1, "jet_pT_rej", "Rejected det. jet #it{p}_{T} spectrum;jet #it{p}_{T} (GeV);Counts", jet_pT]
    jet_pT_det: [1, "jet_pT_det", "Det. jet #it{p}_{T} spectrum;jet #it{p}_{T} (GeV);Counts", jet_pT]
    jet_pT_gen: [1, "jet_pT_gen", "Gen. jet #it{p}_{T} spectrum;jet #it{p}_{T} (GeV);Counts", jet_pT]
    eec_T_rej: [2, "eec_T_rej", "EEC_T (rej);jet #it{p}_{T} (GeV);#it{R}_{L}", jet_pT, RL]
    eec_T_det: [2, "eec_T_det", "EEC_T (det);jet #it{p}_{T} (GeV);#it{R}_{L}", jet_pT, RL]
    eec_T_gen: [2, "eec_T_gen", "EEC_T (gen);jet #it{p}_{T} (GeV);#it{R}_{L}", jet_pT, RL]
    eec_P_rej: [2, "eec_P_rej", "EEC_P (rej);jet #it{p}_{T} (GeV);#it{R}_{L}", jet_pT, RL]
    eec_P_det: [2, "eec_P_det", "EEC_P (det);jet #it{p}_{T} (GeV);#it{R}_{L}", jet_pT, RL]
    eec_P_gen: [2, "eec_P_gen", "EEC_P (gen);jet #it{p}_{T} (GeV);#it{R}_{L}", jet_pT, RL]
    eec_M_rej: [2, "eec_M_rej", "EEC_M (rej);jet #it{p}_{T} (GeV);#it{R}_{L}", jet_pT, RL]
    eec_M_det: [2, "eec_M_det", "EEC_M (det);jet #it{p}_{T} (GeV);#it{R}_{L}", jet_pT, RL]
    eec_M_gen: [2, "eec_M_gen", "EEC_M (gen);jet #it{p}_{T} (GeV);#it{R}_{L}", jet_pT, RL]
    eec_PM_rej: [2, "eec_PM_rej", "EEC_PM (rej);jet #it{p}_{T} (GeV);#it{R}_{L}", jet_pT, RL]
    eec_PM_det: [2, "eec_PM_det", "EEC_PM (det);jet #it{p}_{T} (GeV);#it{R}_{L}", jet_pT, RL]
    eec_PM_gen: [2, "eec_PM_gen", "EEC_PM (gen);jet #it{p}_{T} (GeV);#it{R}_{L}", jet_pT, RL]
    eec_Q_rej: [2, "eec_Q_rej", "EEC_Q (rej);jet #it{p}_{T} (GeV);#it{R}_{L}", jet_pT, RL]
    eec_Q_det: [2, "eec_Q_det", "EEC_Q (det);jet #it{p}_{T} (GeV);#it{R}_{L}", jet_pT, RL]
    eec_Q_gen: [2, "eec_Q_gen", "EEC_Q (gen);jet #it{p}_{T} (GeV);#it{R}_{L}", jet_pT, RL]
